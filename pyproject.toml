[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "devmate"
version = "0.1.0"
description = "Assistente local e rastreável para evolução de documentação Git."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DevMate contributors" }]
dependencies = [
  "alembic>=1.13",
  "markdown-it-py>=3.0",
  "openai>=1.0",
  "openai-codex>=0.1; python_version >= '3.12'",
  "platformdirs>=4.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "rich>=13.7",
  "sqlalchemy>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
devmate = "devmate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devmate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["markdown_it.*"]
ignore_missing_imports = true
